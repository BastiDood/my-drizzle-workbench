name: my-drizzle

services:
  mysql:
    image: mysql:9.7.2-oraclelinux9
    environment:
      MYSQL_DATABASE: app
      MYSQL_ROOT_PASSWORD: password
    volumes:
      - type: volume
        source: mysql-data
        target: /var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping']

  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:1.4.1
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_URL: mysql://root:password@mysql:3306/app
    volumes:
      - type: volume
        source: drizzle-gateway-data
        target: /app
    ports:
      - target: 4983
        published: '4983'
        host_ip: 127.0.0.1
        protocol: tcp

volumes:
  mysql-data:
  drizzle-gateway-data:
